name: Build Kopilka APK

on:

  workflow_dispatch:

jobs:

  build:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout

        uses: actions/checkout@v4

      - name: Find APK

        run: |

          ls -lah

          test -f "Копилка-unsigned.apk"

      - name: Sign APK

        run: |

          APKSIGNER=$(find "$ANDROID_HOME" -type f -name apksigner | sort -V | tail -1)

          if [ -z "$APKSIGNER" ]; then

            echo "apksigner not found"

            exit 1

          fi

          keytool -genkeypair \

            -alias kopilka \

            -keyalg RSA \

            -keysize 2048 \

            -validity 10000 \

            -keystore kopilka.keystore \

            -storepass kopilka123 \

            -keypass kopilka123 \

            -dname "CN=Kopilka"

          "$APKSIGNER" sign \

            --ks kopilka.keystore \

            --ks-pass pass:kopilka123 \

            --key-pass pass:kopilka123 \

            --out Kopilka.apk \

            "Копилка-unsigned.apk"

          "$APKSIGNER" verify Kopilka.apk

      - name: Upload signed APK

        uses: actions/upload-artifact@v4

        with:

          name: Kopilka-APK

          path: Kopilka.apk
